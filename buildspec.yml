version: 0.2
phases:
  pre_build:
    commands:
      - echo "[PRE_BUILD] Connexion ECR..."
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 544925303185.dkr.ecr.us-east-1.amazonaws.com
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-8)
      - echo "Image tag = $IMAGE_TAG"

  build:
    commands:
      - echo "[BUILD] Docker build..."
      - docker build -t 544925303185.dkr.ecr.us-east-1.amazonaws.com/vecu/autosar-app:$IMAGE_TAG .
      - docker tag 544925303185.dkr.ecr.us-east-1.amazonaws.com/vecu/autosar-app:$IMAGE_TAG 544925303185.dkr.ecr.us-east-1.amazonaws.com/vecu/autosar-app:latest

  post_build:
    commands:
      - echo "[POST_BUILD] Push ECR..."
      - docker push 544925303185.dkr.ecr.us-east-1.amazonaws.com/vecu/autosar-app:$IMAGE_TAG
      - docker push 544925303185.dkr.ecr.us-east-1.amazonaws.com/vecu/autosar-app:latest
      - echo "[DONE] Image poussée"
      - printf '[{"name":"vecu-container","imageUri":"544925303185.dkr.ecr.us-east-1.amazonaws.com/vecu/autosar-app:%s"}]' $IMAGE_TAG > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
