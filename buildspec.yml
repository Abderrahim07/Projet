version: 0.2

phases:
  install:
    commands:
      - apt-get update && apt-get install -y gcc make cmake

  pre_build:
    commands:
      - echo Connexion ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION |
          docker login --username AWS --password-stdin $ECR_REPO_URI
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-8)

  build:
    commands:
      - echo Compilation vECU...
      - make all -C src/
      - echo Build image Docker...
      - docker build -t $ECR_REPO_URI:$IMAGE_TAG .
      - docker tag $ECR_REPO_URI:$IMAGE_TAG $ECR_REPO_URI:latest

  post_build:
    commands:
      - docker push $ECR_REPO_URI:$IMAGE_TAG
      - docker push $ECR_REPO_URI:latest
      - aws s3 cp build-report/ s3://$S3_RESULTS_BUCKET/build-artifacts/$IMAGE_TAG/ --recursive

artifacts:
  files: [ '**/*' ]
